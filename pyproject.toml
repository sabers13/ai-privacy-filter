[project]
name = "ai-privacy-filter"
version = "0.1.0"
description = "Pseudonymise personal data on your machine before text reaches an LLM."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AI Privacy Filter contributors" }]
keywords = ["privacy", "pseudonymisation", "pii", "nlp", "german"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

dependencies = [
  "presidio-analyzer>=2.2.365,<3",
  "presidio-anonymizer>=2.2.365,<3",
  "spacy>=3.8,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "faker>=40,<50",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-socket>=0.7,<1",
  "pytest-cov>=5,<8",
  "ruff>=0.7,<1",
  "mypy>=1.11,<2",
  "hypothesis>=6,<7",
]

[project.scripts]
aipf = "ai_privacy_filter.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ai_privacy_filter"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data/external", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ai_privacy_filter"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "live: calls a real LLM or the network; excluded from CI",
  "e2e: end-to-end test through n8n or the HTTP service; excluded from CI",
]

[tool.coverage.run]
source = ["ai_privacy_filter"]
branch = true
