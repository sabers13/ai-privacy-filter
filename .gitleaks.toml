# Secret-scan configuration.
#
# The tracked tree and its history are scanned with the default rule set. The
# only exclusion is the git-ignored external data directory: GermEval 2014
# sentences cite public web pages whose query strings contain "key=", which the
# generic-api-key rule mistakes for a credential. No tracked file is excluded.

title = "ai-privacy-filter"

[extend]
useDefault = true

[[allowlists]]
description = "git-ignored external evaluation data (never committed)"
paths = ['''data/external/''']
