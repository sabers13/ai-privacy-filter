# project-facts.yml — what CareerOps reads back. Commit it at the ROOT of the project repository.
# Every number in a bullet is listed under numbers with the committed results file that proves it.

title: "AI Privacy Filter"
slug: ai-privacy-filter
repo: https://github.com/sabers13/ai-privacy-filter
live_url: https://sabersojudi.com/ai-privacy-filter/
stack: [Python, Presidio, spaCy, FastAPI, n8n, LLM APIs]
stack_label: "Python, Presidio, FastAPI, n8n"
one_line: "pseudonymises personal data in customer email before an AI model sees it"
mention: "a personal-data filter for AI workflows"
summary: "Replaces names, addresses, phone numbers and bank details in German customer enquiries with placeholders before the text reaches an AI model, then restores them in the draft a person reviews. The filter runs on the user's own machine."
tags: [python, nlp, llm, automation, api, testing, ci]
keywords: "data protection, PII, pseudonymisation, n8n, Claude, GDPR, NLP, German"
claim_limits: "Independent project. Pseudonymisation, not anonymisation; not legal advice; detection rates measured on GermEval 2014 and synthetic data, not on real customer mail."

# 3 bullets for the CV: outcome, technical, stack. **bold** marks the numbers.
bullets:
  - kind: outcome
    text: "Caught **99.5%** of the personal-data spans in the synthetic German test set and held the leak rate on that set to **1.9%**; every detection rate was measured on synthetic enquiries and GermEval 2014, not on real customer mail."
    numbers:
      - { value: "99.5", file: "results/SUMMARY.md", contains: "99.5%" }
      - { value: "1.9", file: "results/leak_rate.json", contains: '"leak_rate_pct": 1.9' }
      - { value: "2014", file: "results/SUMMARY.md", contains: "GermEval 2014" }
  - kind: technical
    text: "Combined Presidio with a German spaCy model, added custom recognizers for German street addresses, postcodes, phone numbers and IBANs, and merged overlapping spans in a strict profile that recovered **78.4%** of person and organisation names on the GermEval test set while over-masking **0.0%** of the synthetic test enquiries."
    numbers:
      - { value: "78.4", file: "results/detection_germeval.json", contains: '"recall_pct": 78.4' }
      - { value: "0.0", file: "results/detection_synthetic.json", contains: '"enquiry_rate_pct": 0.0' }
  - kind: stack
    text: "Wrapped the filter in a FastAPI service and an n8n review workflow, kept the optional model calls on local or user-supplied backends, and covered the code with pytest, hypothesis property tests, ruff, mypy --strict and a reproducible make reproduce rerun."
    numbers: []

resources:
  - { name: "GermEval 2014 NER", owner: "Benikova, Biemann, Reznicek (LREC 2014)", licence: "CC BY 4.0", url: "https://sites.google.com/site/germeval2014ner/home", used_as: "held-out detection rates only; not redistributed" }
