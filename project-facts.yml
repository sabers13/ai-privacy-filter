    - "Filtering runs entirely on your machine, proved with sockets disabled"
    - "Measured on synthetic German enquiries and GermEval 2014 test only"
    - "Local n8n review workflow demonstrated end to end on synthetic data"
    - "Optional small local model run on own hardware via Ollama"
  not_made:
    - "GDPR compliance or legal advice"
