# Project facts - machine-readable summary for review and publication.
#
# Every number below points at a committed result file. Update this file only
# from verified outputs; do not type a number that no results file supports.
# "target" or "pending" marks anything that is not a measured result.

project:
  name: AI Privacy Filter
  version: "1.0.0"
  tag: v1.0.0
  status: local-release
  licence: Apache-2.0
  language: Python
  python: "3.12"
  summary: >-
    Pseudonymises personal data in customer enquiries on the local machine,
    guards the outbound text, asks an AI backend for a category, urgency and
    draft reply, and restores the values for human review.
  scope: pseudonymisation, not anonymisation
  legal_note: not legal advice
  publication: local-only (no remote, no push, no deployment)
  page: sabers13.github.io/ai-privacy-filter (local site branch main, unpublished)

repository:
  project_repo: ai-privacy-filter
  page_repo: sabers13.github.io
  branch: fm/aipf-t15
  base_branch: main
  base_commit: 898bdc2ef9e0917cd36175fd429c7d01d2af30b8
  release_tag: v1.0.0
  release_tag_location: local only
  remotes: none
  tracked_germeval_files: 0

data:
  synthetic:
    generator: data/make_synthetic.py
    seed_policy: fixed, committed
    splits:
      dev: 80
      test: 160
    gold_spans_test: 1074
    evidence: data/SOURCES.md
  germeval:
    dataset: GermEval 2014 NER
    licence: CC BY 4.0
    redistribution: not redistributed, downloaded by data/get_germeval.py
    tracked: false
    test_sentences: 5100
    test_person_gold: 1639
    test_org_gold: 1150
    evidence: data/SOURCES.md
  real_person_examples: 0

stack:
  detection: Microsoft Presidio 2.2.366 + spaCy 3.8.18 + de_core_news_lg 3.8.0
  service: FastAPI on 127.0.0.1:8765
  workflow: n8n 2.45.4 (pinned by tag and digest) on 127.0.0.1:5678
  optional_local_model: Ollama with qwen2.5:1.5b
  test_runner: pytest
  lint: ruff + mypy --strict on src
  secret_scan: gitleaks 8.30.1

