# Local end-to-end stack: the privacy gate and a self-hosted n8n.
#
# Only n8n is published, and only on loopback. The gate is reachable from n8n
# over the private compose network. Secrets are supplied at runtime from the
# private environment file; none are written here.

version: "2.4"

services:
  gate:
    build:
      context: .
      dockerfile: Containerfile
    environment:
      AIPF_BIND: "0.0.0.0:8765"
      AIPF_E2E_MODE: "1"
      AIPF_BYOK_BASE_URL: "${AIPF_BYOK_BASE_URL:-}"
      AIPF_BYOK_API_KEY: "${AIPF_BYOK_API_KEY:-}"
      AIPF_BYOK_MODEL: "${AIPF_BYOK_MODEL:-}"
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2)\""
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 20s
    restart: "no"
    networks:
      - aipf

  n8n:
    image: docker.io/n8nio/n8n:2.45.4@sha256:80e23ced901f0e22597d4f3464e3aaf9d835372262ea6f08ef760d8ca35df25c
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - ./.n8n-data:/data/n8n
      - ./.n8n-data/out:/data/out
      - ./.n8n-data/pending:/data/pending
      - ./workflows:/workflows:ro
    environment:
      N8N_USER_FOLDER: "/data/n8n"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_HOST: "127.0.0.1"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      N8N_EDITOR_BASE_URL: "http://127.0.0.1:5678/"
      WEBHOOK_URL: "http://127.0.0.1:5678/"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: "/data/out;/data/pending"
      AIPF_GATE_URL: "${AIPF_GATE_URL:-http://gate:8765}"
      AIPF_BACKEND: "${AIPF_BACKEND:-byok}"
    depends_on:
      gate:
        condition: service_healthy
    restart: "no"
    networks:
      - aipf

networks:
  aipf:
    driver: bridge
