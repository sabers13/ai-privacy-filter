name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: German spaCy model
        run: uv pip install --no-deps "https://github.com/explosion/spacy-models/releases/download/de_core_news_lg-3.8.0/de_core_news_lg-3.8.0-py3-none-any.whl"
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy --strict src
      - name: Tests (no live markers, 85% coverage floor)
        run: >-
          uv run pytest -m "not live and not e2e"
          --cov=ai_privacy_filter --cov-report=term-missing --cov-fail-under=85
      - name: No-network proof
        run: uv run pytest tests/test_local_only.py --disable-socket
